<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Hazel Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/register.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-panel-left">
      <a href="index.html" class="auth-logo">LOGO</a>
      <div class="auth-banner-content">
        <h2>Gabung Bersama Kami</h2>
        <p>Daftarkan akun dan rasakan kemudahan memesan kue kering lezat khas Nusantara langsung dari oven.</p>
      </div>
    </div>

    <div class="auth-panel-right">
      <div class="auth-card">
        <h1 class="auth-title">REGISTER</h1>
        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="name">Nama Lengkap</label>
            <input type="text" id="name" placeholder="Masukkan nama lengkap" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan alamat email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Buat kata sandi aman" required>
              <button type="button" class="btn-toggle-pw" id="togglePassword">Lihat</button>
            </div>
          </div>

          <button type="submit" class="btn-auth-submit">DAFTAR</button>

          <div class="auth-footer-prompt">
            Sudah punya akun? <a href="login.html">Masuk</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
