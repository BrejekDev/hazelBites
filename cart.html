<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja - Hazel Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/cart.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">LOGO</a>
      <div class="nav-search">
        <input type="text" placeholder="Cari..." aria-label="Cari produk">
        <button class="search-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
      </div>
      <div class="nav-actions">
        <a href="profile.html" class="profile-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
      </div>
    </div>
  </header>

  <main class="container cart-main">
    <div class="cart-header">
      <a href="index.html" class="btn-back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        KEMBALI
      </a>
      <h1 class="cart-title">Keranjang Belanja</h1>
    </div>

    <div class="cart-layout">
      <!-- Cart Items List -->
      <div class="cart-items" id="cartItemsList">
        <!-- Item 1 -->
        <div class="cart-card" data-price="125000">
          <img src="assets/images/featured_prod_1.png" alt="Nastar Keju" class="cart-item-img">
          <div class="cart-item-info">
            <h3 class="cart-item-title">Nastar Keju Klasik Spesial (500g)</h3>
            <span class="cart-item-price">Rp 125.000</span>
            <div class="cart-item-actions">
              <div class="qty-control">
                <button type="button" class="btn-qty minus">-</button>
                <span class="qty-number">1</span>
                <button type="button" class="btn-qty plus">+</button>
              </div>
              <button type="button" class="btn-remove">Hapus</button>
            </div>
          </div>
        </div>

        <!-- Item 2 -->
        <div class="cart-card" data-price="135000">
          <img src="assets/images/featured_prod_2.png" alt="Kastengel" class="cart-item-img">
          <div class="cart-item-info">
            <h3 class="cart-item-title">Kastengel Keju Renyah (500g)</h3>
            <span class="cart-item-price">Rp 135.000</span>
            <div class="cart-item-actions">
              <div class="qty-control">
                <button type="button" class="btn-qty minus">-</button>
                <span class="qty-number">1</span>
                <button type="button" class="btn-qty plus">+</button>
              </div>
              <button type="button" class="btn-remove">Hapus</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Summary Sidebar -->
      <div class="cart-summary">
        <!-- Voucher -->
        <div class="voucher-box">
          <label>Kode Voucher</label>
          <div class="voucher-input-wrap">
            <input type="text" id="voucherCode" placeholder="Masukkan Kode Voucher">
            <button type="button" id="btnApplyVoucher">Pakai</button>
          </div>
        </div>

        <!-- Bill Details -->
        <div class="bill-details">
          <div class="bill-row">
            <span>Subtotal</span>
            <span id="subtotalVal">Rp 260.000</span>
          </div>
          <div class="bill-row discount">
            <span>Diskon Voucher</span>
            <span id="discountVal">Rp -0</span>
          </div>
          <div class="bill-divider"></div>
          <div class="bill-row total">
            <span>Total Bayar</span>
            <span id="totalVal">Rp 260.000</span>
          </div>
        </div>

        <a href="checkout.html" class="btn-proceed-checkout">LANJUT CHECKOUT</a>
      </div>
    </div>
  </main>

  <script src="js/cart.js"></script>
</body>
</html>
