<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran Berhasil - Hazel Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/payment-success.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">LOGO</a>
      <div class="nav-search">
        <input type="text" placeholder="Cari..." aria-label="Cari produk">
        <button class="search-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></button>
      </div>
    </div>
  </header>

  <main class="container success-main">
    <div class="success-card">
      <div class="success-icon-wrap">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>

      <h1 class="success-title">Pembayaran Berhasil</h1>
      <p class="success-subtitle">Terima kasih atas pesanan Anda! Pesanan sedang kami siapkan dengan cinta.</p>

      <div class="success-details">
        <div class="detail-row">
          <span>No. Pesanan</span>
          <strong>#ORD-12345</strong>
        </div>
        <div class="detail-row">
          <span>Metode Pembayaran</span>
          <strong>BCA Virtual Account</strong>
        </div>
        <div class="detail-row">
          <span>Tanggal</span>
          <strong>11 September 2026</strong>
        </div>
        <div class="detail-row">
          <span>Total Pembayaran</span>
          <strong class="total-highlight">Rp 277.500</strong>
        </div>
      </div>

      <div class="success-actions">
        <a href="orders.html" class="btn-view-order">Lihat Pesanan</a>
        <a href="index.html" class="btn-to-home">Ke Beranda</a>
      </div>
    </div>
  </main>

  <script src="js/payment-success.js"></script>
</body>
</html>
