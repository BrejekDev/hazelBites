<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hazel Bites</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-panel-left">
      <a href="index.html" class="auth-logo">LOGO</a>
      <div class="auth-banner-content">
        <h2>Selamat Datang Kembali</h2>
        <p>Nikmati kemudahan berbelanja kue kering berkualitas buatan rumahan dengan bahan terbaik.</p>
      </div>
    </div>

    <div class="auth-panel-right">
      <div class="auth-card">
        <h1 class="auth-title">LOGIN</h1>
        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Masukkan alamat email" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Masukkan kata sandi" required>
              <button type="button" class="btn-toggle-pw" id="togglePassword">Lihat</button>
            </div>
          </div>

          <button type="submit" class="btn-auth-submit">MASUK</button>

          <div class="auth-footer-prompt">
            Belum punya akun? <a href="register.html">Daftar</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
